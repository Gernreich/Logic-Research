<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Weight Space Shells</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#F5F6F8;--panel:#FFF;--rule:#DCE1E8;--text:#141A22;--dim:#5E6B7C;
 --accent:#A8630C;--canvas:#EDF0F4;--grid:#CDD4DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ink:#080B11;--panel:#10151E;--rule:#1E2632;--text:#C3CCDA;--dim:#6E7B8E;
 --accent:#E9A23B;--canvas:#05070B;--grid:#171E29}}
:root[data-theme="dark"]{--ink:#080B11;--panel:#10151E;--rule:#1E2632;--text:#C3CCDA;
 --dim:#6E7B8E;--accent:#E9A23B;--canvas:#05070B;--grid:#171E29}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);
 font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5;
 -webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
@media (max-width:800px){.wrap{grid-template-columns:1fr}}
.rail{background:var(--panel);border-right:1px solid var(--rule);padding:18px 15px;
 display:flex;flex-direction:column;gap:16px;max-height:100vh;overflow-y:auto}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--dim);font-size:12.5px;margin:0}
.lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
 font-weight:500;margin:0}
.list{display:flex;flex-direction:column;gap:1px}
.fn{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;
 border:1px solid transparent;background:none;color:var(--text);cursor:pointer;
 font:inherit;font-size:12px;text-align:left;width:100%}
.fn:hover{background:var(--rule)}
.fn[aria-pressed="true"]{border-color:var(--accent);background:var(--rule)}
.fn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fn[disabled]{opacity:.35;cursor:not-allowed}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.nm{flex:1}
.ct{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);
 font-variant-numeric:tabular-nums}
.bits{display:flex;gap:1.5px;flex:none}
.bit{width:6px;height:10px;border-radius:1px;background:var(--grid)}
.bit.on{background:currentColor}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{flex:1;padding:5px 4px;border:0;background:none;color:var(--dim);
 font:inherit;font-size:11.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
label.row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);margin:0}
.stage{position:relative;background:var(--canvas);min-height:60vh}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.readout{position:absolute;left:0;right:0;bottom:0;padding:9px 16px;
 background:linear-gradient(to top,var(--panel),transparent);border-top:1px solid var(--rule);
 font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);
 display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.readout b{color:var(--text);font-weight:500}
.hint{position:absolute;top:11px;right:16px;font-size:11.5px;color:var(--dim);
 font-family:"IBM Plex Mono",monospace}
.note{font-size:11.5px;color:var(--dim);border-top:1px solid var(--rule);padding-top:13px}
.note b{color:var(--text);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div class="wrap">
 <aside class="rail">
  <div><h1>Weight Space Shells</h1>
   <p class="sub">Each point is one hidden&rarr;output weight vector that makes a 2&ndash;3&ndash;1 network compute the selected function. Drag to rotate, scroll to zoom.</p></div>
  <div><p class="lab">Source</p>
   <div class="seg" id="src">
    <button type="button" data-s="gen" aria-pressed="true">Generated</button>
    <button type="button" data-s="arc" aria-pressed="false">2019 archive</button>
   </div></div>
  <div><p class="lab">Function &mdash; all sixteen</p><div class="list" id="list"></div></div>
  <div><p class="lab">View</p>
   <label class="row"><input type="checkbox" id="spin" checked> Auto-rotate</label>
   <label class="row"><input type="checkbox" id="comp"> Overlay complement</label>
   <label class="row"><input type="checkbox" id="axes" checked> Show axes</label></div>
  <p class="note" id="note"></p>
 </aside>
 <div class="stage"><canvas id="c"></canvas>
  <div class="hint">drag &middot; scroll</div><div class="readout" id="ro"></div></div>
</div>
<script>
/*DATA*/
const list=document.getElementById('list'),ro=document.getElementById('ro'),
 note=document.getElementById('note'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
let cur='XOR',src='gen',rx=-0.5,ry=0.7,zoom=1,spin=true,overlay=false,showAxes=true;
const btns={};
Object.entries(DATA).forEach(([k,v])=>{
 const b=document.createElement('button');b.className='fn';b.type='button';b.style.color=v.color;
 b.innerHTML='<span class="dot" style="background:'+v.color+'"></span><span class="nm">'+
  k.replace(/_/g,' ')+'</span><span class="ct" data-ct></span><span class="bits">'+
  v.bits.split(',').map(x=>'<i class="bit'+(x==='1'?' on':'')+'"></i>').join('')+'</span>';
 b.onclick=()=>{if(b.disabled)return;cur=k;refresh();};
 btns[k]=b;list.appendChild(b);});
document.querySelectorAll('#src button').forEach(b=>b.onclick=()=>{
 src=b.dataset.s;document.querySelectorAll('#src button').forEach(x=>
  x.setAttribute('aria-pressed',x===b));
 if(!DATA[cur][src]){const first=Object.keys(DATA).find(k=>DATA[k][src]);if(first)cur=first;}
 refresh();});
function cloud(name){const d=DATA[name];return d?d[src]:null;}
function refresh(){
 Object.entries(DATA).forEach(([k,v])=>{const b=btns[k],c=v[src];
  b.disabled=!c;b.setAttribute('aria-pressed',k===cur);
  b.querySelector('[data-ct]').textContent=c?c.n.toLocaleString():'—';});
 const c=cloud(cur),d=DATA[cur];
 ro.innerHTML=c?('<span>showing <b>'+c.shown.toLocaleString()+'</b> of '+c.n.toLocaleString()+
  '</span><span>radius <b>'+c.rmin.toFixed(2)+' – '+c.rmax.toFixed(2)+
  '</b></span><span>thickness <b>'+(c.rmax-c.rmin).toFixed(2)+
  '</b></span><span>centroid <b>'+c.centroid.map(v=>v.toFixed(2)).join(', ')+'</b></span>')
  :'<span>no data for this function in this source</span>';
 const cm=d.complement,cc=cm?cloud(cm):null;
 document.getElementById('comp').disabled=!cc;
 note.innerHTML=cc?('Complement is <b>'+cm.replace(/_/g,' ')+
  '</b>. Centroids sum to zero — the regions are mirror images through the origin.')
  :'Complement not available in this source.';}
function resize(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
 cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);
function proj(p,cx,cy,s){const ca=Math.cos(ry),sa=Math.sin(ry),cb=Math.cos(rx),sb=Math.sin(rx);
 let x=p[0]*ca-p[2]*sa,z=p[0]*sa+p[2]*ca;let y=p[1]*cb-z*sb;z=p[1]*sb+z*cb;
 const pe=460/(460+z*s*0.5);return [cx+x*s*pe,cy-y*s*pe,z];}
function draw(name,cx,cy,s,am){const c=cloud(name);if(!c)return;const col=DATA[name].color;
 const it=c.pts.map(p=>proj(p,cx,cy,s));it.sort((a,b)=>a[2]-b[2]);ctx.fillStyle=col;
 for(const [x,y,z] of it){const t=Math.max(0,Math.min(1,(z+34)/68));
  ctx.globalAlpha=(0.2+0.62*t)*am;ctx.beginPath();ctx.arc(x,y,0.65+1.45*t,0,6.283);ctx.fill();}
 ctx.globalAlpha=1;}
function axes(cx,cy,s){const st=getComputedStyle(document.documentElement);
 ctx.strokeStyle=st.getPropertyValue('--grid').trim();ctx.lineWidth=1;const L=34;
 [[L,0,0],[0,L,0],[0,0,L]].forEach(v=>{const a=proj([-v[0],-v[1],-v[2]],cx,cy,s),b=proj(v,cx,cy,s);
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});}
function frame(){if(spin)ry+=0.0033;
 const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);
 const cx=w/2,cy=h/2,s=Math.min(w,h)/100*zoom;
 if(showAxes)axes(cx,cy,s);
 const cm=DATA[cur].complement;
 if(overlay&&cm&&cloud(cm))draw(cm,cx,cy,s,0.45);
 draw(cur,cx,cy,s,1);requestAnimationFrame(frame);}
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*0.008;
 rx+=(e.clientY-ly)*0.008;lx=e.clientX;ly=e.clientY;});
cv.addEventListener('wheel',e=>{e.preventDefault();
 zoom=Math.max(0.4,Math.min(4,zoom*(e.deltaY>0?0.92:1.08)));},{passive:false});
document.getElementById('spin').onchange=e=>spin=e.target.checked;
document.getElementById('comp').onchange=e=>overlay=e.target.checked;
document.getElementById('axes').onchange=e=>showAxes=e.target.checked;
resize();refresh();frame();
</script>
</html>
